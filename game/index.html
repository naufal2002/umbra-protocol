<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Umbra Protocol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #05070c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #game-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #game-canvas {
      background: #0a0f1a;
      border: 1px solid #27324a;
      border-radius: 6px;
      box-shadow: 0 0 60px rgba(63, 227, 224, 0.08), 0 20px 50px rgba(0,0,0,0.6);
      image-rendering: pixelated;
      max-width: 96vw;
      max-height: 90vh;
    }
    #game-title {
      color: #8fa3c0;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="game-shell">
    <canvas id="game-canvas"></canvas>
    <div id="game-title">Umbra Protocol — top-down stealth infiltration</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
